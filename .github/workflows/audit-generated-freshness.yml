name: Audit Generated Freshness

on:
  schedule:
    # Offset from the repository writer so the audit observes the delivered result.
    - cron: '47 3,9,15,21 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tezos-systems-generated-freshness-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit committed generated artifacts
        id: generated
        continue-on-error: true
        run: npm run check:generated:freshness

      - name: Audit historical ledgers
        id: history
        if: always()
        continue-on-error: true
        run: npm run check:supabase:freshness

      - name: Report every freshness failure
        if: always()
        run: |
          failed=0
          if [ "${{ steps.generated.outcome }}" != "success" ]; then
            echo "Generated artifact freshness audit failed"
            failed=1
          fi
          if [ "${{ steps.history.outcome }}" != "success" ]; then
            echo "Historical ledger freshness audit failed"
            failed=1
          fi
          exit "$failed"
